name: Android personal app preview

on:
  push:
    branches:
      - feat/android-personal-app
    paths:
      - 'mobile/android/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/register-test-modules.mjs'
      - 'vite.android.config.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feat/android-personal-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without large gallery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            .github
            functions
            harness
            mobile
            scripts
            src
            tests
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.25.0'
      - name: Build and test the Android frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm run build:android
      - name: Select JDK 21 and verify SDK
        run: |
          set -eu
          test -x "${JAVA_HOME_21_X64:?JDK 21 not provisioned}/bin/javac"
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:?Android SDK not provisioned}/platforms/android-36"
      - name: Build debug-signed test APK
        run: |
          npm --prefix mobile/android ci
          npm --prefix mobile/android run android:prepare
          (cd mobile/android/android && ./gradlew --no-daemon testDebugUnitTest assembleDebug)
          mkdir -p android-preview
          cp mobile/android/android/app/build/outputs/apk/debug/app-debug.apk android-preview/role-studio-android-debug.apk
          (cd android-preview && sha256sum role-studio-android-debug.apk > SHA256SUMS.txt)
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: role-studio-android-preview-${{ github.sha }}
          path: android-preview/
          if-no-files-found: error
          retention-days: 7
