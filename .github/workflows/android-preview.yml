name: Android personal app build

on:
  push:
    branches:
      - feat/android-personal-app
    paths:
      - 'mobile/android/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/register-test-modules.mjs'
      - 'vite.android.config.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feat/android-personal-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: android-personal-signing
    steps:
      - name: Check signing setup
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ secrets.ROLE_STUDIO_KEYSTORE_BASE64 != '' && secrets.ROLE_STUDIO_KEYSTORE_PASSWORD != '' }}
          CONFIGURED_CERT: ${{ vars.ROLE_STUDIO_CERT_SHA256 }}
        run: |
          if [[ "$SIGNING_CONFIGURED" != true ]]; then
            echo "::error::Set ROLE_STUDIO_KEYSTORE_BASE64 and ROLE_STUDIO_KEYSTORE_PASSWORD in android-personal-signing."
            exit 1
          fi
          if [[ "$CONFIGURED_CERT" =~ ^([0-9a-fA-F]{2}:){31}[0-9a-fA-F]{2}$ ]]; then
            CONFIGURED_CERT=${CONFIGURED_CERT//:/}
          fi
          if [[ ! "$CONFIGURED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Set ROLE_STUDIO_CERT_SHA256 to a SHA-256 certificate fingerprint (64 hex digits, with or without colons)."
            exit 1
          fi
          printf 'EXPECTED_CERT=%s\n' "${CONFIGURED_CERT,,}" >> "$GITHUB_ENV"
      - name: Check out source without large gallery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            .github
            functions
            harness
            mobile
            scripts
            src
            tests
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.25.0'
      - name: Build and test the Android frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm run build:android
      - name: Select JDK 21 and verify SDK
        run: |
          set -eu
          test -x "${JAVA_HOME_21_X64:?JDK 21 not provisioned}/bin/javac"
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:?Android SDK not provisioned}/platforms/android-36"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/role-studio-gradle" >> "$GITHUB_ENV"
      - name: Prepare Android project
        run: |
          npm --prefix mobile/android ci
          npm --prefix mobile/android run android:prepare
      - name: Cache the Android Gradle wrapper and dependencies
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          dependency-graph: disabled
          cache-read-only: false # This job runs only on the persistent Android branch.
      - name: Test the Android app
        working-directory: mobile/android/android
        shell: bash
        run: |
          log="$RUNNER_TEMP/role-studio-gradle.log"
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'https://repo\.maven\.apache\.org/maven2/.*(status code 429|429 Too Many Requests)' "$log"; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "::warning::Maven Central returned HTTP 429. Retrying Gradle in ${delay}s."
            sleep "$delay"
          done
      - name: Build the unsigned personal release
        working-directory: mobile/android/android
        shell: bash
        run: |
          version=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease -ProleStudioUnsignedRelease=true -ProleStudioVersionCode="$version"
          echo "ROLE_STUDIO_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Sign and verify the personal APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ROLE_STUDIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROLE_STUDIO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/role-studio-sign.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$scratch/key.p12"
          unset KEYSTORE_BASE64
          apk=mobile/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          tool_dir=
          for dir in "$ANDROID_HOME"/build-tools/*; do
            version=${dir##*/}
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
               (( ${version%%.*} >= 35 )) &&
               [[ -x "$dir/apksigner" && -x "$dir/zipalign" && -x "$dir/aapt" ]]; then
              tool_dir=$(printf '%s\n' "$tool_dir" "$dir" | sort -V | tail -1)
            fi
          done
          test -n "$tool_dir" && test -s "$apk"
          "$tool_dir/zipalign" -P 16 -f 4 "$apk" "$scratch/aligned.apk"
          "$tool_dir/apksigner" sign --ks "$scratch/key.p12" --ks-key-alias role-studio \
            --ks-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "$scratch/signed.apk" "$scratch/aligned.apk"
          unset KEYSTORE_PASSWORD
          "$tool_dir/zipalign" -c -P 16 4 "$scratch/signed.apk"
          "$tool_dir/apksigner" verify --print-certs "$scratch/signed.apk" > "$scratch/cert.txt"
          mapfile -t certificates < <(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' "$scratch/cert.txt")
          if [[ "${#certificates[@]}" != 1 || "${certificates[0],,}" != "${EXPECTED_CERT,,}" ]]; then
            echo 'Signing certificate does not match the configured SHA-256 fingerprint.'
            exit 1
          fi
          badging=$("$tool_dir/aapt" dump badging "$scratch/signed.apk")
          expected="package: name='com.dafanshu.rolestudio' versionCode='$ROLE_STUDIO_BUILD_VERSION'"
          if [[ "$badging" != "$expected "* ]] || grep -q '^application-debuggable' <<<"$badging"; then
            echo 'Unexpected APK package, version, or debuggable flag.'
            exit 1
          fi
          mkdir -p android-personal
          filename="role-studio-personal-$ROLE_STUDIO_BUILD_VERSION.apk"
          mv "$scratch/signed.apk" "android-personal/$filename"
          printf 'commit=%s\nversionCode=%s\ncertificateSHA256=%s\n' "$GITHUB_SHA" "$ROLE_STUDIO_BUILD_VERSION" "${certificates[0],,}" > android-personal/BUILD.txt
          (cd android-personal && sha256sum "$filename" > SHA256SUMS.txt)
      - name: Upload the installable personal APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: role-studio-personal-apk-${{ github.sha }}
          path: android-personal/
          if-no-files-found: error
          retention-days: 7
