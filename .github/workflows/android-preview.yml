name: Android personal app build

on:
  push:
    branches:
      - feat/android-personal-app
    paths:
      - 'mobile/android/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/register-test-modules.mjs'
      - 'vite.android.config.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feat/android-personal-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without large gallery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            .github
            functions
            harness
            mobile
            scripts
            src
            tests
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.25.0'
      - name: Build and test the Android frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm run build:android
      - name: Select JDK 21 and verify SDK
        run: |
          set -eu
          test -x "${JAVA_HOME_21_X64:?JDK 21 not provisioned}/bin/javac"
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:?Android SDK not provisioned}/platforms/android-36"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/role-studio-gradle" >> "$GITHUB_ENV"
      - name: Prepare Android project
        run: |
          npm --prefix mobile/android ci
          npm --prefix mobile/android run android:prepare
      - name: Cache the Android Gradle wrapper and dependencies
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          dependency-graph: disabled
          cache-read-only: false # This job runs only on the persistent Android branch.
      - name: Test and build the debug APK
        working-directory: mobile/android/android
        shell: bash
        run: |
          log="$RUNNER_TEMP/role-studio-gradle.log"
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'https://repo\.maven\.apache\.org/maven2/.*(status code 429|429 Too Many Requests)' "$log"; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "::warning::Maven Central returned HTTP 429. Retrying Gradle in ${delay}s."
            sleep "$delay"
          done
      - name: Build the unsigned personal release
        working-directory: mobile/android/android
        shell: bash
        run: |
          version=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease -ProleStudioUnsignedRelease=true -ProleStudioVersionCode="$version"
          echo "ROLE_STUDIO_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Package unsigned release for local signing
        shell: bash
        run: |
          mkdir -p android-unsigned
          apk=mobile/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$tool" && test -s "$apk"
          if "$tool" verify "$apk"; then
            echo 'Unexpected signing certificate on the unsigned release.'
            exit 1
          fi
          badging=$("$(dirname "$tool")/aapt" dump badging "$apk")
          grep -q "package: name='com.dafanshu.rolestudio' versionCode='$ROLE_STUDIO_BUILD_VERSION'" <<<"$badging"
          if grep -q '^application-debuggable' <<<"$badging"; then exit 1; fi
          cp "$apk" android-unsigned/role-studio-unsigned.apk
          cp mobile/android/scripts/Sign-RoleStudio.ps1 android-unsigned/
          printf 'commit=%s\nversionCode=%s\n' "$GITHUB_SHA" "$ROLE_STUDIO_BUILD_VERSION" > android-unsigned/BUILD.txt
          (cd android-unsigned && sha256sum role-studio-unsigned.apk > SHA256SUMS.txt)
      - name: Upload unsigned personal release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: role-studio-personal-unsigned-${{ github.sha }}
          path: android-unsigned/
          if-no-files-found: error
          retention-days: 7
      - name: Package debug APK and checksum
        run: |
          mkdir -p android-preview
          cp mobile/android/android/app/build/outputs/apk/debug/app-debug.apk android-preview/role-studio-android-debug.apk
          (cd android-preview && sha256sum role-studio-android-debug.apk > SHA256SUMS.txt)
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: role-studio-android-preview-${{ github.sha }}
          path: android-preview/
          if-no-files-found: error
          retention-days: 7
