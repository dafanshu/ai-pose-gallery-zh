apply plugin: 'com.android.application'

// Personal releases are signed locally with the owner's existing key. No test
// signer fallback; GitHub preview builds use only the independent debug target.
def personalStore = providers.environmentVariable('ROLE_STUDIO_KEYSTORE').orNull
def personalAlias = providers.environmentVariable('ROLE_STUDIO_KEY_ALIAS').orNull
def personalStorePassword = providers.environmentVariable('ROLE_STUDIO_KEYSTORE_PASSWORD').orNull
def personalKeyPassword = providers.environmentVariable('ROLE_STUDIO_KEY_PASSWORD').orNull
def personalSigningReady = [personalStore, personalAlias, personalStorePassword, personalKeyPassword].every { value -> value }

android {
    namespace = 'com.dafanshu.rolestudio'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.dafanshu.rolestudio'
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode 6
        versionName '0.5.0'
    }
    if (personalSigningReady) {
        signingConfigs {
            personalRelease {
                storeFile = file(personalStore)
                storeType = 'PKCS12'
                keyAlias = personalAlias
                storePassword = personalStorePassword
                keyPassword = personalKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.personalRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            if (!personalSigningReady) {
                throw new GradleException('Personal release signing is not configured. See docs/ANDROID-PERSONAL-SIGNING.md.')
            }
            if (!file(personalStore).isFile()) {
                throw new GradleException('The personal release keystore file was not found.')
            }
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 4.12.1 is the patched 4.x line; the Android variant of 5.5.x requires SDK 37.
    implementation 'com.squareup.okhttp3:okhttp:4.12.1'
    testImplementation "junit:junit:$junitVersion"
    // Real JSON implementation for JVM unit tests; Android keeps its built-in org.json.
    testImplementation 'org.json:json:20251224'
}

apply from: 'capacitor.build.gradle'
